<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>크로스오버 카드게임 (뼈대)</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="screen-auth" class="screen">
    <h1>크로스오버 카드게임</h1>

    <form id="form-login">
      <h2>로그인</h2>
      <input type="text" id="login-username" placeholder="닉네임" required />
      <input type="password" id="login-password" placeholder="비밀번호" required />
      <button type="submit">로그인</button>
      <p id="login-error" class="error"></p>
      <p>계정이 없으신가요? <a href="#" id="link-to-signup">회원가입</a></p>
    </form>

    <form id="form-signup" class="hidden">
      <h2>회원가입</h2>
      <input type="text" id="signup-username" placeholder="닉네임 (2~20자)" required />
      <input type="password" id="signup-password" placeholder="비밀번호 (6자 이상)" required />
      <button type="submit">회원가입</button>
      <p id="signup-error" class="error"></p>
      <p>이미 계정이 있으신가요? <a href="#" id="link-to-login">로그인</a></p>
    </form>
  </div>

  <div id="screen-lobby" class="screen hidden">
    <h1>크로스오버 카드게임</h1>
    <p>환영합니다, <strong id="lobby-username"></strong>님</p>
    <button id="btn-join-queue">매칭 시작</button>
    <button id="btn-logout">로그아웃</button>
    <p id="lobby-status"></p>

    <div id="admin-panel" class="hidden">
      <h2>관리자 패널</h2>
      <div id="admin-user-list"></div>
    </div>
  </div>

  <div id="screen-waiting" class="screen hidden">
    <h2>상대를 찾는 중...</h2>
  </div>

  <div id="screen-game" class="screen hidden">
    <div id="opponent-area" class="player-area">
      <h3 id="opp-name">상대</h3>
      <div class="stats">
        <span>HP: <span id="opp-hp">-</span></span>
        <span>마나: <span id="opp-mana">-</span>/<span id="opp-max-mana">-</span></span>
        <span>손패: <span id="opp-hand-count">-</span>장</span>
        <span>덱: <span id="opp-deck-count">-</span>장</span>
      </div>
      <div id="opp-board" class="board"></div>
    </div>

    <div id="turn-indicator"></div>

    <div id="my-area" class="player-area">
      <h3 id="my-name">나</h3>
      <div class="stats">
        <span>HP: <span id="my-hp">-</span></span>
        <span>마나: <span id="my-mana">-</span>/<span id="my-max-mana">-</span></span>
        <span>덱: <span id="my-deck-count">-</span>장</span>
      </div>
      <div id="my-board" class="board"></div>
      <div id="my-hand" class="hand"></div>
      <button id="btn-end-turn">턴 종료</button>
    </div>
  </div>

  <div id="screen-result" class="screen hidden">
    <h2 id="result-text"></h2>
  </div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="main.js"></script>
</body>
</html>
