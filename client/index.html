<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>크로스오버 카드게임 (뼈대)</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="screen-auth" class="screen">
    <h1>크로스오버 카드게임</h1>

    <form id="form-login">
      <h2>로그인</h2>
      <input type="text" id="login-username" placeholder="닉네임" required />
      <input type="password" id="login-password" placeholder="비밀번호" required />
      <button type="submit">로그인</button>
      <p id="login-error" class="error"></p>
      <p>계정이 없으신가요? <a href="#" id="link-to-signup">회원가입</a></p>
    </form>

    <form id="form-signup" class="hidden">
      <h2>회원가입</h2>
      <input type="text" id="signup-username" placeholder="닉네임 (2~20자)" required />
      <input type="password" id="signup-password" placeholder="비밀번호 (6자 이상)" required />
      <button type="submit">회원가입</button>
      <p id="signup-error" class="error"></p>
      <p>이미 계정이 있으신가요? <a href="#" id="link-to-login">로그인</a></p>
    </form>
  </div>

  <div id="screen-lobby" class="screen hidden">
    <h1>크로스오버 카드게임</h1>
    <p>환영합니다, <strong id="lobby-username"></strong>님</p>
    <button id="btn-join-queue">매칭 시작</button>
    <button id="btn-edit-deck">덱 편집</button>
    <button id="btn-logout">로그아웃</button>
    <p id="lobby-status"></p>

    <div id="admin-panel" class="hidden">
      <h2>관리자 패널</h2>
      <div id="admin-user-list"></div>

      <h3>카드 관리</h3>
      <form id="form-new-card" class="admin-card-form">
        <input type="text" id="new-card-name" placeholder="이름" required />
        <input type="text" id="new-card-series" placeholder="계열 (예: demon_slayer_corps)" required />
        <select id="new-card-type" required>
          <option value="character">캐릭터</option>
          <option value="spell">스펠</option>
          <option value="equipment">장비</option>
        </select>
        <input type="number" id="new-card-cost" placeholder="코스트" min="0" required />
        <select id="new-card-rarity">
          <option value="common">일반</option>
          <option value="legendary">전설</option>
        </select>
        <input type="text" id="new-card-tags" placeholder="시너지태그 (콤마로 구분)" />
        <textarea id="new-card-description" placeholder="카드 설명 (선택)"></textarea>
        <label>
          카드 이미지 (선택)
          <input type="file" id="new-card-image" accept="image/*" />
        </label>

        <span data-type-group="character">
          <input type="number" id="new-card-atk" placeholder="공격력" min="0" />
          <input type="number" id="new-card-hp" placeholder="체력" min="0" />
          <select id="new-card-matchup-tag">
            <option value="">상성 없음</option>
          </select>
          <input type="number" id="new-card-matchup-bonus" placeholder="상성 공격력 보너스" min="0" />
        </span>

        <span data-type-group="equipment">
          <input type="number" id="new-card-equip-atk" placeholder="장착 공격력 보너스" min="0" />
          <input type="number" id="new-card-equip-hp" placeholder="장착 체력 보너스" min="0" />
        </span>

        <span data-type-group="spell,equipment">
          <select id="new-card-required-tag">
            <option value="">대상 제한 없음</option>
          </select>
        </span>

        <fieldset class="effect-editor">
          <legend>효과 (선택)</legend>
          <select id="new-card-trigger">
            <option value="">없음</option>
          </select>
          <select id="new-card-action">
            <option value="DAMAGE">피해(DAMAGE)</option>
            <option value="HEAL">회복(HEAL)</option>
            <option value="DRAW">카드뽑기(DRAW)</option>
            <option value="BUFF">스탯부여(BUFF)</option>
          </select>
          <select id="new-card-target">
            <option value="ENEMY_HERO">적 영웅</option>
            <option value="ALL_ENEMIES">적 전체</option>
            <option value="ALL_ALLIES">내 캐릭터 전체</option>
            <option value="TARGET_CHARACTER">지정 캐릭터</option>
            <option value="SELF">자신</option>
          </select>
          <input type="number" id="new-card-value" placeholder="수치" />
        </fieldset>

        <button type="submit">카드 생성</button>
        <p id="new-card-error" class="error"></p>
      </form>
      <select id="admin-card-series-filter">
        <option value="">전체 계열</option>
      </select>
      <div id="admin-card-list"></div>
    </div>
  </div>

  <div id="screen-waiting" class="screen hidden">
    <h2>상대를 찾는 중...</h2>
  </div>

  <div id="screen-deck-builder" class="screen hidden">
    <h2>덱 편집</h2>
    <p>
      덱: <span id="deck-count">0</span>/30장 ·
      전설: <span id="deck-legendary-count">0</span>/2장
    </p>
    <button id="btn-deck-save">저장</button>
    <button id="btn-deck-back">로비로</button>
    <p id="deck-error" class="error"></p>
    <div class="deck-builder-columns">
      <div>
        <h3>전체 카드</h3>
        <div id="deck-catalog-list"></div>
      </div>
      <div>
        <h3>내 덱</h3>
        <div id="deck-current-list"></div>
      </div>
    </div>
  </div>

  <div id="screen-game" class="screen hidden">
    <div id="opponent-area" class="player-area">
      <h3 id="opp-name">상대</h3>
      <div class="stats">
        <span>HP: <span id="opp-hp">-</span></span>
        <span>마나: <span id="opp-mana">-</span>/<span id="opp-max-mana">-</span></span>
        <span>손패: <span id="opp-hand-count">-</span>장</span>
        <span>덱: <span id="opp-deck-count">-</span>장</span>
      </div>
      <div id="opp-board" class="board"></div>
    </div>

    <div id="turn-indicator"></div>

    <div id="my-area" class="player-area">
      <h3 id="my-name">나</h3>
      <div class="stats">
        <span>HP: <span id="my-hp">-</span></span>
        <span>마나: <span id="my-mana">-</span>/<span id="my-max-mana">-</span></span>
        <span>덱: <span id="my-deck-count">-</span>장</span>
      </div>
      <div id="my-board" class="board"></div>
      <div id="my-hand" class="hand"></div>
      <button id="btn-end-turn">턴 종료</button>
    </div>
  </div>

  <div id="screen-result" class="screen hidden">
    <h2 id="result-text"></h2>
  </div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="main.js"></script>
</body>
</html>
